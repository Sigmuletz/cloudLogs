[project]
name = "cloudlogs"
version = "0.1.0"
description = "Log viewer and filter for Kubernetes/Quarkus JSON logs"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cloudlogs = "cloudlogs.main:main"
cloudlogs-ingest = "cloudlogs.ingest:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cloudlogs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
